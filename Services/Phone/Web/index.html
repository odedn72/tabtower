<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TabTower">
<meta name="theme-color" content="#111418">
<title>TabTower</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1b1f24; --muted: #6a737d; --line: #e3e6ea;
    --accent: #2f6fde; --working: #2f6fde; --waiting: #e07b00; --done: #8a5cf6; --idle: #9aa3ad;
    --error: #d23c3c; --wrapped: #1f9d55; --shade: rgba(0, 0, 0, .45);
    --board: #d63f93; --board-empty: #6e7f8f; --machine: #3f8fb8; --forked: #e0544a; --peer: #5f8f74;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --card: #1b2027; --text: #e8ebef; --muted: #96a0ab; --line: #2a313a;
      --accent: #6aa0ff; --working: #6aa0ff; --waiting: #ffa53d; --done: #b99cf5; --idle: #6d7680;
      --error: #ff6b6b; --wrapped: #3ccf7f; --shade: rgba(0, 0, 0, .6);
      --board: #ff5fb0; --board-empty: #6e7f8f; --machine: #7fb8d8; --forked: #e0544a; --peer: #7fa38f;
    }
  }
  * { box-sizing: border-box; }
  /* A row scrolled into view lands below the sticky header, not under it. */
  html { scroll-padding-top: 150px; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.4 -apple-system, "Segoe UI", Arial, sans-serif;
         padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom)); }
  header { position: sticky; top: 0; background: var(--bg); padding: 14px 0 10px; z-index: 2; }
  h1 { margin: 0; font-size: 22px; display: flex; align-items: center; gap: 8px; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .chip { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); }
  .chip b { font-weight: 600; }
  .chip.waiting { border-color: var(--waiting); }
  .banner { background: var(--card); border: 1px solid var(--waiting); border-radius: 12px; padding: 10px 12px; margin: 8px 0; font-size: 14px; }
  .banner.err { border-color: var(--error); }
  .card { background: var(--card); border: 1px solid var(--line); border-inline-start-width: 4px;
          border-radius: 14px; margin: 12px 0; overflow: hidden; }
  .card-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px; }
  .ws-title { font-weight: 600; font-size: 17px; overflow-wrap: anywhere; text-align: start; }
  .ws-path { color: var(--muted); font-size: 12px; direction: ltr; text-align: start; overflow-wrap: anywhere; unicode-bidi: plaintext; }
  .btn { appearance: none; border: 0; border-radius: 10px; background: var(--accent); color: #fff;
         font: inherit; font-size: 14px; font-weight: 600; padding: 8px 12px; white-space: nowrap; cursor: pointer; }
  .btn:disabled { opacity: .5; }
  .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  .btn.danger { background: var(--error); }
  .rows { border-top: 1px solid var(--line); }
  .row { display: flex; align-items: center; gap: 8px; padding: 0 14px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row-link { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 10px 0; color: inherit; text-decoration: none; }
  .end, .reopen { appearance: none; flex: none; border: 1px solid var(--line); border-radius: 10px; background: transparent;
                  font: inherit; font-size: 13px; font-weight: 600; padding: 8px 10px; cursor: pointer; }
  .end { color: var(--error); }
  .reopen { color: var(--accent); }
  .end:disabled, .reopen:disabled { opacity: .5; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--idle); }
  .st-working .dot { background: var(--working); animation: pulse 1.6s infinite; }
  .st-waiting .dot { background: var(--waiting); }
  .st-done .dot { background: var(--done); }
  .st-wrapped .dot { background: var(--wrapped); }
  .st-error .dot { background: var(--error); }
  /* What the deck card shows in place of the status (session.shown), in the deck's own colours.
     After the st- rules so they win: a board or a machine wait is a `done` underneath. */
  .sh-board_open .dot { background: var(--board); }
  .sh-board_empty .dot { background: var(--board-empty); }
  .sh-runs .dot, .sh-watch .dot, .sh-job .dot { background: var(--machine); }
  .sh-forked .dot { background: var(--forked); animation: none; }
  .sh-peer .dot { background: var(--peer); }
  @keyframes pulse { 50% { opacity: .35; } }
  .r-main { flex: 1; min-width: 0; }
  /* up to 3 lines, so a title is readable instead of cut at one line */
  .r-title { overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3;
             overflow-wrap: anywhere; text-align: start; }
  .r-meta { color: var(--muted); font-size: 12px; }
  .st-waiting .r-meta { color: var(--waiting); font-weight: 600; }
  .sh-board_open .r-meta { color: var(--board); font-weight: 600; }
  .sh-forked .r-meta { color: var(--forked); font-weight: 600; }
  .pin { font-size: 13px; }
  .is-new .r-meta { color: var(--accent); font-weight: 600; }
  .go { color: var(--accent); font-size: 13px; flex: none; }
  .empty { color: var(--muted); font-size: 14px; padding: 10px 14px; border-top: 1px solid var(--line); }
  .caption { color: var(--muted); font-size: 12px; padding: 0 14px 10px; }
  .groups { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .toast { position: fixed; inset-inline: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); background: var(--text); color: var(--bg);
           border-radius: 12px; padding: 12px 14px; font-size: 14px; display: none; z-index: 5; }
  .toast a { color: inherit; font-weight: 700; }
  /* While a toast shows, the page gets room below its last row, so nothing stays under it. */
  body.toasting { padding-bottom: calc(140px + env(safe-area-inset-bottom)); }
  .pair { text-align: center; padding: 18px 16px 22px; }
  .pair h2 { margin: 4px 0 8px; font-size: 20px; }
  .code { font: 700 40px/1.2 ui-monospace, Consolas, monospace; letter-spacing: .25em; direction: ltr; margin: 12px 0; }
  .sheet { position: fixed; inset: 0; background: var(--shade); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
  .sheet[hidden] { display: none; }
  .sheet-box { background: var(--card); width: 100%; max-width: 520px; border-radius: 16px 16px 0 0;
               padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
  .sheet-title { font-weight: 700; font-size: 18px; margin-bottom: 6px; }
  .sheet-text { color: var(--muted); font-size: 15px; overflow-wrap: anywhere; }
  .sheet-actions { display: flex; gap: 10px; margin-top: 16px; }
  .sheet-actions .btn { flex: 1; padding: 12px; font-size: 16px; }
  /* The hidden attribute wins over every display rule below (.tabs, .fast and the rest are flex). */
  [hidden] { display: none !important; }
  /* Two views, sessions and tasks; the tasks tab exists only when the PC has a tasks file. */
  .tabs { display: flex; gap: 6px; margin-top: 10px; }
  .tab { flex: 1; appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--text);
         border-radius: 10px; padding: 8px; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
  .tab.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .runbox { display: flex; gap: 8px; margin: 12px 0 4px; }
  .runbox input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 9px 12px; border-radius: 10px;
                  border: 1px solid var(--line); background: var(--card); color: var(--text); }
  .navstrip { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 4px; -webkit-overflow-scrolling: touch; }
  .navchip { flex: none; appearance: none; border: 2px solid var(--line); background: var(--card); color: var(--text);
             border-radius: 10px; min-width: 42px; padding: 6px 10px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
  .navchip.on { background: var(--accent); color: #fff; }
  .navchip:disabled { opacity: .5; }
  .task { padding: 12px 14px; }
  .t-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .t-id { font-weight: 700; color: var(--text); }
  .t-status { padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); }
  .t-name { font-weight: 600; font-size: 16px; margin-top: 4px; overflow-wrap: anywhere; text-align: start; }
  .t-lead { font-size: 14px; margin-top: 4px; overflow-wrap: anywhere; text-align: start; }
  .t-desc { color: var(--muted); font-size: 13px; margin-top: 4px; white-space: pre-line; overflow-wrap: anywhere; text-align: start;
            overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; }
  .t-desc.open { display: block; -webkit-line-clamp: unset; line-clamp: unset; }
  .t-more { appearance: none; border: 0; background: none; color: var(--accent); font: inherit; font-size: 13px; padding: 4px 0 0; cursor: pointer; }
  .t-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .t-actions a.btn { text-decoration: none; }
  .t-sep { color: var(--muted); font-size: 12px; margin: 14px 2px 0; }
  .options { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .options .btn { padding: 12px; font-size: 16px; border-inline-start: 6px solid transparent; text-align: start; }
  .phrase { margin: 8px 0; padding: 8px 10px; border-radius: 8px; background: var(--bg); color: var(--text);
            font-weight: 600; overflow-wrap: anywhere; }
  .toast .t-more { color: inherit; font-weight: 700; text-decoration: underline; }
  .opt-state { color: var(--muted); font-weight: 400; font-size: 14px; }
  .fast { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 15px; }
  .fast input { width: 20px; height: 20px; }
</style>
</head>
<body>
<header>
  <h1><span data-i18n="app_title">TabTower</span>
    <button class="btn ghost" id="refresh" style="margin-inline-start:auto" data-i18n="refresh" data-i18n-title="refresh_title">Refresh</button></h1>
  <div class="sub" id="stamp"></div>
  <div class="sub" id="summary"></div>
  <div class="chips" id="chips"></div>
  <div class="tabs" id="tabs" hidden>
    <button class="tab on" data-tab="sessions" data-i18n="tab_sessions">Sessions</button>
    <button class="tab" data-tab="tasks" data-i18n="tab_tasks">Tasks</button>
  </div>
</header>
<div id="banner"></div>
<section class="card pair" id="pair" hidden>
  <h2 id="pair-title"></h2>
  <div class="sheet-text" id="pair-text"></div>
  <div class="sub" id="pair-code-label"></div>
  <div class="code" id="pair-code"></div>
  <div class="sub" id="pair-wait"></div>
</section>
<main id="list"></main>
<section id="tasks-view" hidden>
  <form class="runbox" id="runbox">
    <input id="run-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go"
           dir="ltr" data-i18n-placeholder="run_placeholder" data-i18n-title="run_title">
    <button class="btn" type="submit" data-i18n="run_go" data-i18n-title="run_title">Run</button>
  </form>
  <div class="navstrip" id="navstrip"></div>
  <div class="sub" id="tasks-meta"></div>
  <div id="tasks-banner"></div>
  <div id="tasks"></div>
</section>
<section class="card" id="closed-card" hidden>
  <div class="card-h"><div class="ws-title" data-i18n="closed_heading">Recently closed</div>
    <button class="btn ghost" id="closed-toggle" data-i18n="show" data-i18n-title="show_title">Show</button></div>
  <div id="closed-wrap" hidden>
    <div class="caption" id="closed-caption"></div>
    <div class="rows" id="closed"></div>
  </div>
</section>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet-box">
    <div class="sheet-title" id="sheet-title"></div>
    <div class="sheet-text" id="sheet-text"></div>
    <div class="sheet-actions">
      <button class="btn ghost" id="sheet-cancel" data-i18n="cancel" data-i18n-title="cancel_title">Cancel</button>
      <button class="btn" id="sheet-ok"></button>
    </div>
  </div>
</div>
<div class="sheet" id="launch" hidden role="dialog" aria-modal="true" aria-labelledby="launch-title">
  <div class="sheet-box">
    <div class="sheet-title" id="launch-title"></div>
    <div class="sheet-text" id="launch-text"></div>
    <label class="fast" id="launch-fast-row" hidden><input type="checkbox" id="launch-fast"><span data-i18n="task_launch_fast">Fast variant</span></label>
    <div class="sub" id="launch-pick"></div>
    <div class="options" id="launch-options"></div>
    <div class="sheet-actions">
      <button class="btn ghost" id="launch-cancel" data-i18n="cancel" data-i18n-title="cancel_title">Cancel</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" data-i18n-title="toast_dismiss_title"></div>

<script>
  // Every visible word comes from the string table the server picks for this browser's
  // language (/i18n). This file holds no user-facing text of its own beyond English fallbacks.
  let S = {};
  const t = (key, vars) => {
    let s = S[key] ?? key;
    for (const k in (vars || {})) s = s.split('{' + k + '}').join(vars[k]);
    return s;
  };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const HDR = { 'X-TabTower-Phone': '1' };
  const STATUSES = ['working', 'waiting', 'done', 'idle', 'error', 'wrapped', 'replaced'];

  async function loadStrings() {
    const langs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en']).join(',');
    try {
      const r = await fetch('/i18n?langs=' + encodeURIComponent(langs), { cache: 'no-store' });
      const d = await r.json();
      S = d.strings || {};
      document.documentElement.lang = d.lang || 'en';
      document.documentElement.dir = S._dir === 'rtl' ? 'rtl' : 'ltr';
    } catch { S = {}; }
    document.title = t('app_title');
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-title]').forEach((el) => { el.title = t(el.dataset.i18nTitle); });
    document.querySelectorAll('[data-i18n-placeholder]').forEach((el) => { el.placeholder = t(el.dataset.i18nPlaceholder); });
    $('stamp').textContent = t('loading');
  }

  // Relative time in the Claude app's units: now / 12m / 4h / 1d.
  function ago(ms) {
    const m = Math.max(0, Math.round((Date.now() - ms) / 60000));
    if (m < 1) return t('now');
    if (m < 60) return m + t('unit_m');
    if (m < 1440) return Math.floor(m / 60) + t('unit_h');
    return Math.floor(m / 1440) + t('unit_d');
  }

  const statusKey = (s) => (STATUSES.includes(s) ? s : 'idle');

  function hideToast() {
    $('toast').style.display = 'none';
    document.body.classList.remove('toasting');
  }
  function toast(html, ms = 6000) {
    const el = $('toast');
    el.innerHTML = html; el.style.display = 'block';
    document.body.classList.add('toasting');
    clearTimeout(el._h); el._h = setTimeout(hideToast, ms);
  }
  // Tapping the message (anywhere but its link or button) dismisses it. A [data-copy] link or
  // button copies the session's opening phrase first; the copy starts inside the tap itself,
  // which is what a phone browser requires, and a link then carries on to the app.
  $('toast').addEventListener('click', (ev) => {
    const copy = ev.target.closest('[data-copy]');
    if (copy && copy.dataset.copy) {
      try { navigator.clipboard.writeText(copy.dataset.copy).catch(() => { }); } catch { }
      if (copy.tagName === 'BUTTON') copy.textContent = t('task_copied');
      return;
    }
    if (!ev.target.closest('a')) hideToast();
  });

  function reason(d, status) {
    const code = d && d.error ? d.error : '';
    const known = code && S['err_' + code] ? t('err_' + code) : (code || ('HTTP ' + status));
    return d && d.detail ? known + ' (' + d.detail + ')' : known;
  }

  // ---- confirmation sheet: every action that changes something on the PC asks first ----
  let sheetDone = null;
  function confirmSheet(title, text, okLabel, okTitle, danger) {
    $('sheet-title').textContent = title;
    $('sheet-text').textContent = text;
    const ok = $('sheet-ok');
    ok.textContent = okLabel; ok.title = okTitle || '';
    ok.className = 'btn' + (danger ? ' danger' : '');
    $('sheet').hidden = false;
    ok.focus();
    return new Promise((resolve) => { sheetDone = resolve; });
  }
  function closeSheet(answer) {
    if ($('sheet').hidden) return;
    $('sheet').hidden = true;
    const done = sheetDone; sheetDone = null;
    if (done) done(answer);
  }
  $('sheet-ok').addEventListener('click', () => closeSheet(true));
  $('sheet-cancel').addEventListener('click', () => closeSheet(false));
  $('sheet').addEventListener('click', (ev) => { if (ev.target === $('sheet')) closeSheet(false); });
  document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') closeSheet(false); });

  // ---- the session list ----
  let busy = false;
  let lastCards = [];

  // The words the deck card shows: its state over the status when it has one (s.shown, e.g. an
  // empty question board, or a turn that ended waiting for a machine), else the status.
  function rowLabel(s, k) {
    if (s.new) return t('st_new');
    if (s.shown) return t('sh_' + s.shown + (s.count > 1 ? '_n' : ''), { n: s.count });
    return t('st_' + k) + (k === 'done' && s.ack ? ' · ' + t('seen') : '');
  }

  // Which chip a session counts in, as the deck colours it: a board with questions is the
  // user's turn; an empty board and a wait for a machine are nobody's chip, whatever the
  // status underneath says. A forked session still counts by its status.
  const chipKey = (s) => (s.shown === 'board_open' ? 'done' : s.shown && s.shown !== 'forked' ? '' : s.status);

  function row(s) {
    const k = statusKey(s.status);
    const label = rowLabel(s, k);
    const pin = s.pinned ? `<span class="pin" title="${esc(t('pinned_title'))}">📌</span> ` : '';
    const inner = `<span class="dot"></span>
      <span class="r-main"><div class="r-title" dir="auto">${pin}${esc(s.title || t('untitled'))}</div>
      <div class="r-meta">${esc(label)}${s.at ? ' · ' + esc(ago(s.at)) : ''}${s.group ? ' · <bdi>' + esc(s.group) + '</bdi>' : ''}</div></span>
      ${s.link ? `<span class="go">${esc(t('open_app'))}</span>` : ''}`;
    const main = s.link
      ? `<a class="row-link" href="${esc(s.link)}" title="${esc(t('open_app_title'))}">${inner}</a>`
      : `<div class="row-link">${inner}</div>`;
    const shown = s.shown && !s.new ? ' sh-' + esc(s.shown) : '';
    return `<div class="row st-${k}${shown}${s.new ? ' is-new' : ''}">${main}<button class="end" data-close="${esc(s.id)}" data-title="${esc(s.title || '')}"
      title="${esc(t('close_title'))}">${esc(t('close'))}</button></div>`;
  }

  function render(d) {
    lastCards = d.cards || [];
    const all = lastCards.flatMap((c) => c.sessions);
    const count = (k) => all.filter((s) => chipKey(s) === k).length;
    $('chips').innerHTML =
      `<span class="chip waiting">${esc(t('chip_waiting'))} <b>${count('waiting')}</b></span>
       <span class="chip">${esc(t('chip_working'))} <b>${count('working')}</b></span>
       <span class="chip">${esc(t('chip_done'))} <b>${count('done')}</b></span>`;
    $('stamp').textContent = t('updated', { time: new Date().toLocaleTimeString(document.documentElement.lang, { hour: '2-digit', minute: '2-digit', second: '2-digit' }) });
    $('summary').textContent = t('summary', { sessions: all.length, cards: lastCards.length });

    const html = lastCards.map((c, i) => {
      // Pinned sessions first, as on the deck (the server sends them newest pin first and the
      // sort is stable, so that order holds), then newest activity first, the same order as
      // the Claude app's own session list.
      const ss = [...c.sessions].sort((a, b) => ((b.pinned ? 1 : 0) - (a.pinned ? 1 : 0))
        || (a.pinned ? 0 : (b.at || 0) - (a.at || 0)));
      const many = c.targets.length > 1;
      const buttons = c.targets.length
        ? `<div class="groups">${c.targets.map((g) => g.state === 'ready'
            ? `<button class="btn" data-card="${i}" data-group="${esc(g.group)}" title="${esc(t('new_session_title'))}">${esc(many ? t('new_session_group', { group: g.label }) : t('new_session'))}</button>`
            : `<button class="btn ghost" data-card="${i}" data-group="${esc(g.group)}" title="${esc(t('launch_title'))}">${esc(t('launch_group', { group: g.label }))}</button>`).join('')}</div>`
        : `<span class="r-meta">${esc(t('no_window'))}</span>`;
      return `<section class="card" data-color="${esc(c.color)}">
        <div class="card-h"><div style="min-width:0"><div class="ws-title" dir="auto">${esc(c.title)}</div>
        <div class="ws-path">${esc(c.path)}</div></div>${buttons}</div>
        <div class="rows">${ss.length ? ss.map(row).join('') : `<div class="empty">${esc(t('no_sessions'))}</div>`}</div>
      </section>`;
    }).join('');
    $('list').innerHTML = html || `<div class="banner">${esc(t('no_cards'))}</div>`;
    // The card's own colour, as on the deck. Set through the DOM so the value is never parsed as markup.
    $('list').querySelectorAll('section.card').forEach((el) => { el.style.borderInlineStartColor = el.dataset.color || ''; });
  }

  function showPairing(d) {
    $('list').innerHTML = ''; $('chips').innerHTML = ''; $('summary').textContent = ''; $('stamp').textContent = '';
    $('closed-card').hidden = true;
    $('pair').hidden = false;
    $('tabs').hidden = true; $('tasks-view').hidden = true;
    if (d.error === 'denied') {
      $('pair-title').textContent = t('denied_title');
      $('pair-text').textContent = t('denied_text');
      $('pair-code-label').textContent = ''; $('pair-code').textContent = ''; $('pair-wait').textContent = '';
    } else {
      $('pair-title').textContent = t('pair_title');
      $('pair-text').textContent = t('pair_text', { device: d.device || '' });
      $('pair-code-label').textContent = t('pair_code_label');
      $('pair-code').textContent = d.code || '';
      $('pair-wait').textContent = t('pair_wait');
    }
  }

  let pairTimer = null;
  async function load() {
    if (busy) return;
    try {
      const r = await fetch('/api/list', { cache: 'no-store', headers: HDR });
      const d = await r.json().catch(() => ({}));
      if (r.status === 403 && (d.error === 'pairing' || d.error === 'denied')) {
        showPairing(d);
        clearTimeout(pairTimer);
        pairTimer = setTimeout(load, 3000);   // opens by itself once approved on the PC
        return;
      }
      if (!r.ok) {
        $('banner').innerHTML = `<div class="banner err">${esc(reason(d, r.status))}</div>`;
        return;
      }
      $('pair').hidden = true;
      $('closed-card').hidden = tab !== 'sessions';
      // A device approved while this page waited: the tasks tab was never asked about yet.
      if (!tasksKnown) loadTasks();
      $('banner').innerHTML = '';
      render(d);
    } catch (e) {
      $('banner').innerHTML = `<div class="banner err">${esc(t('err_unreachable', { reason: e.message }))}</div>`;
    }
  }

  // A session just opened from here: refresh every 3 s until its row carries the app link
  // (Claude Code publishes it a moment after the session starts), for up to a minute.
  let linkWatch = null;
  function watchForLink(id) {
    clearInterval(linkWatch);
    let tries = 0;
    linkWatch = setInterval(async () => {
      tries++;
      await load();
      const row = lastCards.flatMap((c) => c.sessions).find((s) => s.id === id);
      if ((row && row.link) || tries >= 20) clearInterval(linkWatch);
    }, 3000);
  }

  async function post(path, body) {
    const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json', ...HDR }, body: JSON.stringify(body) });
    const d = await r.json().catch(() => ({}));
    return { r, d };
  }

  // Close one session, and its tab on the PC.
  $('list').addEventListener('click', async (ev) => {
    const b = ev.target.closest('button[data-close]');
    if (!b || busy) return;
    ev.preventDefault();
    const title = b.dataset.title || t('untitled');
    if (!await confirmSheet(t('close_confirm_title'), t('close_confirm_text', { title }), t('close_confirm_ok'), t('close_title'), true)) return;
    busy = true;
    b.disabled = true; b.textContent = t('closing');
    try {
      const { r, d } = await post('/api/close', { id: b.dataset.close });
      // A session closed before its first message is dropped on the PC, so it has nothing to
      // reopen and does not appear under "Recently closed": the message says so.
      toast(d.ok ? esc(t(d.removed ? 'toast_closed_empty' : 'toast_closed')) : esc(t('failed', { reason: reason(d, r.status) })),
            d.ok ? (d.removed ? 9000 : 4000) : 9000);
    } catch (e) {
      toast(esc(t('failed', { reason: e.message })), 9000);
    } finally {
      busy = false; load();
      // An open "Recently closed" shows the session just closed, ready to reopen.
      if (!$('closed-wrap').hidden) loadClosed();
    }
  });

  // Open a new session from a card. It runs code on the PC, so it is confirmed first.
  $('list').addEventListener('click', async (ev) => {
    const b = ev.target.closest('button[data-card]');
    if (!b || busy) return;
    const c = lastCards[Number(b.dataset.card)];
    if (!c) return;
    const target = c.targets.find((g) => g.group === b.dataset.group) || { group: '', label: '' };
    const groupText = target.label && c.targets.length > 1 ? t('new_confirm_group', { group: target.label }) : '';
    if (!await confirmSheet(t('new_confirm_title'), t('new_confirm_text', { card: c.title, group: groupText }),
                            t('new_confirm_ok'), t('new_session_title'), false)) return;
    busy = true;
    document.querySelectorAll('button[data-card]').forEach((x) => (x.disabled = true));
    b.textContent = t('opening');
    toast(esc(t('toast_opening')), 40000);
    try {
      const { r, d } = await post('/api/new', { card: c.key, group: target.group });
      if (!d.ok) toast(esc(t('failed', { reason: reason(d, r.status) })), 9000);
      else if (d.launching) toast(esc(t('toast_launching')), 15000);
      else if (d.link) toast(`${esc(t('toast_new_link'))} <a href="${esc(d.link)}">${esc(t('toast_open_in_app'))}</a>`, 20000);
      else toast(esc(t('toast_new_nolink')), 9000);
      if (d.ok && d.sessionId && !d.link) watchForLink(d.sessionId);
    } catch (e) {
      toast(esc(t('failed', { reason: e.message })), 9000);
    } finally { busy = false; load(); }
  });

  // ---- recently closed: loaded only when opened ----
  async function loadClosed() {
    const box = $('closed');
    box.innerHTML = `<div class="empty">${esc(t('loading'))}</div>`;
    try {
      const r = await fetch('/api/closed', { cache: 'no-store', headers: HDR });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || !d.ok) { box.innerHTML = `<div class="empty">${esc(reason(d, r.status))}</div>`; return; }
      $('closed-caption').textContent = t('closed_caption', { n: d.sessions.length });
      box.innerHTML = d.sessions.length ? d.sessions.map((s) => `<div class="row st-idle">
          <div class="row-link"><span class="dot"></span><span class="r-main">
            <div class="r-title" dir="auto">${esc(s.title || t('untitled'))}</div>
            <div class="r-meta">${esc(t('closed_meta'))} · ${esc(ago(s.at))}${s.group ? ' · <bdi>' + esc(s.group) + '</bdi>' : ''} · <bdi>${esc(s.workspace)}</bdi></div></span></div>
          <button class="reopen" data-reopen="${esc(s.id)}" data-title="${esc(s.title || '')}" title="${esc(t('reopen_title'))}">${esc(t('reopen'))}</button></div>`).join('')
        : `<div class="empty">${esc(t('no_closed'))}</div>`;
    } catch (e) {
      box.innerHTML = `<div class="empty">${esc(t('failed', { reason: e.message }))}</div>`;
    }
  }

  $('closed-toggle').addEventListener('click', () => {
    const wrap = $('closed-wrap');
    wrap.hidden = !wrap.hidden;
    $('closed-toggle').textContent = t(wrap.hidden ? 'show' : 'hide');
    $('closed-toggle').title = t(wrap.hidden ? 'show_title' : 'hide_title');
    if (!wrap.hidden) loadClosed();
  });

  $('closed').addEventListener('click', async (ev) => {
    const b = ev.target.closest('button[data-reopen]');
    if (!b || busy) return;
    // No confirmation here, by decision: reopening is undone by closing it again, unlike a close.
    busy = true;
    b.disabled = true; b.textContent = t('reopening');
    toast(esc(t('toast_reopening')), 30000);
    try {
      const { r, d } = await post('/api/reopen', { id: b.dataset.reopen });
      if (!d.ok) toast(esc(t('failed', { reason: reason(d, r.status) })), 9000);
      else if (d.link) toast(`${esc(t('toast_reopened_link'))} <a href="${esc(d.link)}">${esc(t('toast_open_in_app'))}</a>`, 20000);
      else toast(esc(t('toast_reopened_nolink')), 9000);
    } catch (e) {
      toast(esc(t('failed', { reason: e.message })), 9000);
    } finally { busy = false; load(); loadClosed(); }
  });

  // ---- tasks: the PC's tasks page, the same level and the same squares ----
  // The phone keeps no view of its own. A square or a card's link is followed ON THE PC, the
  // producer rewrites the tasks file, and both screens show the new level; loadedAt moving is
  // the sign it has landed.
  let tab = 'sessions';
  let lastTasks = null;
  let navBusy = false;
  let tasksKnown = false;

  function showTab(name) {
    tab = name === 'tasks' && !$('tabs').hidden ? 'tasks' : 'sessions';
    document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
    $('list').hidden = tab !== 'sessions';
    $('closed-card').hidden = tab !== 'sessions' || !$('pair').hidden;
    $('tasks-view').hidden = tab !== 'tasks';
    try { localStorage.setItem('tt-tab', tab); } catch { }
    if (tab === 'tasks') loadTasks();
  }
  document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => showTab(b.dataset.tab)));

  function taskCard(task) {
    const status = task.status ? `<span class="t-status" dir="auto" style="border-color:${esc(task.color)}">${esc(task.status)}</span>` : '';
    const actions = [];
    if (task.canStart) actions.push(`<button class="btn" data-start="${esc(task.id)}" title="${esc(t('task_start_title'))}">${esc(t('task_start'))}</button>`);
    if (task.nav) actions.push(`<button class="btn ghost" data-nav="${esc(task.id)}" title="${esc(t('task_open_title'))}" dir="auto">${esc(task.navLabel || t('task_open'))}</button>`);
    if (task.link) actions.push(`<a class="btn ghost" href="${esc(task.link)}" target="_blank" rel="noopener">${esc(t('task_link'))}</a>`);
    return `<section class="card task" data-color="${esc(task.color)}">
      <div class="t-head"><bdi class="t-id" dir="ltr">${esc(task.id)}</bdi>${status}</div>
      <div class="t-name" dir="auto">${esc(task.name)}</div>
      ${task.lead ? `<div class="t-lead" dir="auto">${esc(task.lead)}</div>` : ''}
      ${task.description ? `<div class="t-desc" dir="auto">${esc(task.description)}</div><button class="t-more" data-more>${esc(t('task_more'))}</button>` : ''}
      ${actions.length ? `<div class="t-actions">${actions.join('')}</div>` : ''}
    </section>`;
  }

  function renderTasks(v) {
    lastTasks = v;
    const squares = (v.home ? [{ ...v.home, kind: 'home' }] : []).concat(v.nav.map((n) => ({ ...n, kind: 'nav' })));
    $('navstrip').innerHTML = squares.map((n) => `<button class="navchip${n.active ? ' on' : ''}" data-kind="${n.kind}" data-id="${esc(n.number)}"
        data-color="${esc(n.color)}" title="${esc(n.name + (n.detail ? ' · ' + n.detail : ''))}" dir="auto">${esc(n.label)}</button>`).join('');
    $('navstrip').querySelectorAll('.navchip').forEach((el) => { el.style.borderColor = el.dataset.color || ''; });
    $('navstrip').hidden = squares.length === 0;
    // The square of the level on screen may sit past the edge of a long row.
    const on = $('navstrip').querySelector('.navchip.on');
    if (on) {
      const box = $('navstrip').getBoundingClientRect(), chip = on.getBoundingClientRect();
      // Centre it, only when it is not fully visible; scrollLeft grows rightwards in both directions.
      if (chip.left < box.left || chip.right > box.right)
        $('navstrip').scrollLeft += (chip.left + chip.width / 2) - (box.left + box.width / 2);
    }
    $('tasks-meta').textContent = v.generated ? t('tasks_meta', { generated: v.generated }) : '';
    $('tasks-banner').innerHTML = v.error ? `<div class="banner err" dir="auto">${esc(v.error)}</div>` : '';
    const pinned = v.tasks.filter((x) => x.pinned), rest = v.tasks.filter((x) => !x.pinned);
    $('tasks').innerHTML = pinned.map(taskCard).join('')
      + (pinned.length && rest.length ? `<div class="t-sep"></div>` : '')
      + rest.map(taskCard).join('')
      + (v.tasks.length ? '' : `<div class="banner">${esc(t('tasks_empty'))}</div>`);
    $('tasks').querySelectorAll('section.card').forEach((el) => { el.style.borderInlineStartColor = el.dataset.color || ''; });
    // "More" only where the description is really cut.
    $('tasks').querySelectorAll('.t-desc').forEach((el) => {
      if (el.scrollHeight <= el.clientHeight + 2) el.nextElementSibling.hidden = true;
    });
  }

  async function fetchTasks() {
    const r = await fetch('/api/tasks', { cache: 'no-store', headers: HDR });
    const d = await r.json().catch(() => ({}));
    return { r, d };
  }

  async function loadTasks() {
    try {
      const { r, d } = await fetchTasks();
      if (r.status === 403) { load(); return; }
      if (!r.ok || !d.ok) { $('tasks-banner').innerHTML = `<div class="banner err">${esc(reason(d, r.status))}</div>`; return; }
      tasksKnown = true;
      $('tabs').hidden = !d.tasks.enabled;
      $('tasks-view').hidden = tab !== 'tasks' || !d.tasks.enabled;
      if (!d.tasks.enabled) { if (tab === 'tasks') showTab('sessions'); return; }
      renderTasks(d.tasks);
    } catch (e) {
      $('tasks-banner').innerHTML = `<div class="banner err">${esc(t('err_unreachable', { reason: e.message }))}</div>`;
    }
  }

  // Follow a link on the PC, then wait (up to ~10 s) for the tasks file to be rewritten.
  async function navigate(kind, id, what) {
    if (navBusy || busy) return;
    navBusy = true;
    document.querySelectorAll('.navchip, button[data-nav]').forEach((x) => (x.disabled = true));
    toast(esc(t('nav_moving', { what })), 12000);
    const before = lastTasks ? lastTasks.loadedAt : 0;
    try {
      const { r, d } = await post('/api/tasks/nav', { kind, id });
      if (!d.ok) { toast(esc(t('failed', { reason: reason(d, r.status) })), 9000); return; }
      for (let i = 0; i < 20; i++) {
        await new Promise((res) => setTimeout(res, 500));
        const { d: v } = await fetchTasks();
        if (v.ok && v.tasks.loadedAt !== before) { renderTasks(v.tasks); hideToast(); window.scrollTo(0, 0); return; }
      }
      toast(esc(t('nav_slow')), 9000);
    } catch (e) {
      toast(esc(t('failed', { reason: e.message })), 9000);
    } finally {
      navBusy = false;
      document.querySelectorAll('.navchip, button[data-nav]').forEach((x) => (x.disabled = false));
    }
  }

  $('navstrip').addEventListener('click', (ev) => {
    const b = ev.target.closest('.navchip');
    if (b) navigate(b.dataset.kind, b.dataset.id, b.title || b.textContent);
  });

  $('tasks').addEventListener('click', (ev) => {
    const more = ev.target.closest('button[data-more]');
    if (more) {
      const desc = more.previousElementSibling;
      desc.classList.toggle('open');
      more.textContent = t(desc.classList.contains('open') ? 'task_less' : 'task_more');
      return;
    }
    const nav = ev.target.closest('button[data-nav]');
    if (nav) { navigate('task', nav.dataset.nav, nav.textContent); return; }
    const start = ev.target.closest('button[data-start]');
    if (start && lastTasks) {
      const task = lastTasks.tasks.find((x) => x.id === start.dataset.start);
      if (task) launchTask(task);
    }
  });

  // The window picker: one button per VS Code instance, each the window the same click on the
  // PC with that key held opens in. Resolves to { option, fast } or null.
  let launchDone = null;
  function pickLaunch(task) {
    const options = lastTasks && lastTasks.options.length ? lastTasks.options : [{ key: '', label: t('task_launch_default'), color: '' }];
    $('launch-title').textContent = t('task_launch_title');
    $('launch-text').textContent = t('task_launch_text', { task: task.id + ' · ' + task.name });
    $('launch-fast-row').hidden = !task.hasFast;
    $('launch-fast').checked = false;
    $('launch-pick').textContent = options.length > 1 ? t('task_launch_pick') : '';
    // A window that is not up says so: picking it starts it first, which takes about a minute.
    $('launch-options').innerHTML = options.map((o) => `<button class="btn ghost" data-option="${esc(o.key)}" data-color="${esc(o.color)}"
        ${o.state === 'off' ? 'disabled' : ''} title="${esc(t('task_launch_state_' + (o.state || 'ready') + '_title'))}" dir="auto">${esc(o.label)}${o.state === 'ready' || !o.state ? '' : `<span class="opt-state"> · ${esc(t('task_launch_state_' + o.state))}</span>`}</button>`).join('');
    $('launch-options').querySelectorAll('button').forEach((el) => { el.style.borderInlineStartColor = el.dataset.color || 'var(--accent)'; });
    hideToast();
    $('launch').hidden = false;
    return new Promise((resolve) => { launchDone = resolve; });
  }
  function closeLaunch(answer) {
    if ($('launch').hidden) return;
    $('launch').hidden = true;
    const done = launchDone; launchDone = null;
    if (done) done(answer);
  }
  $('launch-options').addEventListener('click', (ev) => {
    const b = ev.target.closest('button[data-option]');
    if (b) closeLaunch({ option: b.dataset.option, fast: !$('launch-fast-row').hidden && $('launch-fast').checked });
  });
  $('launch-cancel').addEventListener('click', () => closeLaunch(null));
  $('launch').addEventListener('click', (ev) => { if (ev.target === $('launch')) closeLaunch(null); });
  document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') closeLaunch(null); });

  // Open a session from a task. The opening phrase is the tasks file's, on the PC; the phone
  // sends only the task's number and the window.
  async function launchTask(task) {
    if (busy) return;
    const pick = await pickLaunch(task);
    if (!pick) return;
    busy = true;
    toast(esc(t('toast_opening')), 40000);
    try {
      const { r, d } = await post('/api/tasks/start', { id: task.id, option: pick.option, fast: pick.fast });
      // VS Code types the phrase into the new tab without sending it, so from here the user sends
      // it from the app: the toast shows it, and its link copies it on the way to the app.
      const phrase = d.prompt ? `<div class="phrase" dir="auto">${esc(d.prompt)}</div>` : '';
      if (!d.ok) toast(esc(t('failed', { reason: reason(d, r.status) })), 9000);
      else if (d.launching) toast(esc(t('toast_launching')), 15000);
      else if (d.link) toast(`${esc(t(d.prompt ? 'toast_task_new' : 'toast_new_link'))}${phrase}
          <a href="${esc(d.link)}" data-copy="${esc(d.prompt || '')}">${esc(t(d.prompt ? 'task_copy_open' : 'toast_open_in_app'))}</a>`, 60000);
      else if (d.prompt) toast(`${esc(t('toast_task_new'))}${phrase}<button class="t-more" data-copy="${esc(d.prompt)}">${esc(t('task_copy'))}</button>`, 60000);
      else toast(esc(t('toast_new_nolink')), 9000);
      if (d.ok && d.sessionId && !d.link) watchForLink(d.sessionId);
    } catch (e) {
      toast(esc(t('failed', { reason: e.message })), 9000);
    } finally { busy = false; load(); }
  }

  // The Run box: a task number from anywhere in the tree, as on the PC's toolbar.
  $('runbox').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const typed = $('run-input').value.trim().replace(/^#/, '');
    if (!typed) { toast(esc(t('run_empty')), 4000); return; }
    try {
      const r = await fetch('/api/tasks/find?id=' + encodeURIComponent(typed), { cache: 'no-store', headers: HDR });
      const d = await r.json().catch(() => ({}));
      if (!d.ok) { toast(esc(t('failed', { reason: reason(d, r.status) })), 9000); return; }
      if (!d.task.canStart) { toast(esc(t('failed', { reason: t('err_no_workspace') })), 9000); return; }
      $('run-input').blur();
      await launchTask(d.task);
      $('run-input').value = '';
    } catch (e) {
      toast(esc(t('failed', { reason: e.message })), 9000);
    }
  });

  // A full reload, not just a data fetch: it also brings a newer version of this page.
  $('refresh').addEventListener('click', () => location.reload());
  const idle = () => !document.hidden && $('pair').hidden && $('sheet').hidden && $('launch').hidden;
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { load(); if (tab === 'tasks') loadTasks(); } });
  setInterval(() => { if (idle()) { load(); if (tab === 'tasks' && !navBusy) loadTasks(); } }, 15000);
  loadStrings().then(load).then(async () => {
    await loadTasks();
    let saved = 'sessions';
    try { saved = localStorage.getItem('tt-tab') || 'sessions'; } catch { }
    showTab(saved);
  });
</script>
</body>
</html>
